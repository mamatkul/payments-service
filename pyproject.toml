[project]
name = "payments-service"
version = "0.1.0"
description = "Asynchronous payment processing service: FastAPI, PostgreSQL, RabbitMQ (FastStream), transactional outbox."
readme = "README.md"
authors = [{ name = "Mamatkul" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1,<2",
    "asyncpg>=0.32.0,<1",
    "fastapi>=0.162.2,<1",
    "faststream[rabbit,cli]>=0.7.8,<0.8",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16.2,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.0.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payments"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S", "PT", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (TEST_DATABASE_URL)",
    "rabbitmq: needs RabbitMQ (TEST_RABBITMQ_URL)",
]

[tool.coverage.run]
source = ["payments"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
